services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tt
      POSTGRES_PASSWORD: tt
      POSTGRES_DB: tt
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tt"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "${API_PORT:-8400}:8400"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    command: ["python", "-m", "apps.worker.main"]
    volumes:
      - ./data:/app/data
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      args:
        NEXT_PUBLIC_API_BASE: ""
    environment:
      NEXT_PUBLIC_API_BASE: ""
      PORT: "3400"
    ports:
      - "${DASHBOARD_PORT:-3400}:3400"
    depends_on: [api]
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, dashboard]
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
